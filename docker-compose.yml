services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms64M -Xmx256M"
    depends_on:
      - kafka
  poller:
    build: ./ingestion
    container_name: poller
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  spark-master:
    image: apache/spark:4.0.1-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # master web UI
      - "4040:4040"   # UI of the running application
    volumes:
      - ./spark/jobs:/opt/jobs
      - ./data/lake:/opt/lake

  spark-worker-1:
    image: apache/spark:4.0.1-python3
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 2 --memory 2g spark://spark-master:7077
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/jobs
      - ./data/lake:/opt/lake

  spark-worker-2:
    image: apache/spark:4.0.1-python3
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 2 --memory 2g --webui-port 8082 spark://spark-master:7077
    ports:
      - "8082:8082"
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/jobs
      - ./data/lake:/opt/lake
  bronze-job:
    image: apache/spark:4.0.1-python3
    container_name: bronze-job
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1,io.delta:delta-spark_2.13:4.0.1
      --conf spark.jars.ivy=/opt/ivy
      --conf spark.driver.host=bronze-job
      /opt/jobs/bronze_positions.py
    ports:
      - "4041:4040"
    depends_on:
      - spark-master
      - kafka
    restart: unless-stopped
    volumes:
      - ./spark/jobs:/opt/jobs
      - ./data/lake:/opt/lake
      - ivy-cache:/opt/ivy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  kafka-data:
  ivy-cache: